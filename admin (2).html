<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rankd Admin - Score Management</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .admin-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .admin-header {
            background: var(--color-bg-card);
            border: 1px solid var(--color-border);
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .admin-header h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            color: var(--color-primary);
        }

        .filters {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .filter-group label {
            font-size: 0.9rem;
            color: var(--color-text-muted);
            font-weight: 500;
        }

        .filter-group select,
        .filter-group input {
            padding: 0.75rem;
            background: var(--color-bg-light);
            border: 1px solid var(--color-border);
            border-radius: 8px;
            color: var(--color-text);
            font-family: var(--font-primary);
        }

        .match-admin-card {
            background: var(--color-bg-card);
            border: 1px solid var(--color-border);
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .match-admin-header {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--color-border);
            margin-bottom: 1.5rem;
        }

        .result-input {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .result-input input {
            width: 60px;
            padding: 0.75rem;
            text-align: center;
            font-size: 1.25rem;
            font-weight: 700;
            background: var(--color-bg-light);
            border: 1px solid var(--color-border);
            border-radius: 8px;
            color: var(--color-text);
        }

        .btn-evaluate {
            padding: 0.75rem 1.5rem;
            background: var(--color-primary);
            color: var(--color-bg);
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-evaluate:hover {
            background: var(--color-primary-dark);
        }

        .predictions-table {
            width: 100%;
            border-collapse: collapse;
        }

        .predictions-table th {
            text-align: left;
            padding: 1rem;
            background: var(--color-bg-light);
            color: var(--color-text-muted);
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        .predictions-table td {
            padding: 1rem;
            border-top: 1px solid var(--color-border);
        }

        .predictions-table tr:hover {
            background: var(--color-bg-light);
        }

        .prediction-score {
            font-family: var(--font-mono);
            font-weight: 700;
            font-size: 1.1rem;
        }

        .points-badge {
            display: inline-block;
            padding: 0.375rem 0.75rem;
            background: rgba(0, 255, 136, 0.1);
            color: var(--color-primary);
            border-radius: 6px;
            font-weight: 700;
            font-family: var(--font-mono);
        }

        .points-badge.zero {
            background: rgba(255, 71, 87, 0.1);
            color: var(--color-error);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--color-bg-card);
            border: 1px solid var(--color-border);
            border-radius: 12px;
            padding: 1.5rem;
        }

        .stat-label {
            color: var(--color-text-muted);
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--color-primary);
            font-family: var(--font-mono);
        }

        .bulk-actions {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .btn-bulk {
            padding: 0.875rem 1.5rem;
            background: var(--color-bg-light);
            color: var(--color-text);
            border: 1px solid var(--color-border);
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-bulk:hover {
            border-color: var(--color-primary);
            color: var(--color-primary);
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="admin-header">
            <h1>🎯 Admin Panel - Score Management</h1>
            <p style="color: var(--color-text-muted);">Update match results and evaluate predictions</p>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Total Predictions</div>
                <div class="stat-value" id="totalPredictions">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Evaluated</div>
                <div class="stat-value" id="evaluatedCount">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Pending</div>
                <div class="stat-value" id="pendingCount">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Active Users</div>
                <div class="stat-value" id="activeUsers">0</div>
            </div>
        </div>

        <div class="filters">
            <div class="filter-group">
                <label>Match Status</label>
                <select id="filterStatus">
                    <option value="all">All Matches</option>
                    <option value="finished">Finished</option>
                    <option value="pending">Pending Evaluation</option>
                    <option value="evaluated">Evaluated</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Search Match</label>
                <input type="text" id="searchMatch" placeholder="Team name...">
            </div>
        </div>

        <div id="matchesList">
            <div class="loading">Loading matches...</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth, signInWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
        import { getFirestore, collection, getDocs, updateDoc, doc, query, where } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDIvc_I2Fdy5UQPtLX-7lq8-LR_J6sOmGo",
            authDomain: "rank-web-d0802.firebaseapp.com",
            projectId: "rank-web-d0802",
            storageBucket: "rank-web-d0802.firebasestorage.app",
            messagingSenderId: "158245993895",
            appId: "1:158245993895:web:6904ef01d7cfa13e2bca82"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const API_KEY = '3a204daf3e81b37238d8be247b1fd8a8';
        const LEAGUE_ID = 39;
        const SEASON = 2025;

        let allFixtures = [];
        let allPredictions = [];

        // Simple password protection
        const ADMIN_PASSWORD = prompt('Enter admin password:');
        if (ADMIN_PASSWORD !== 'rankd2025') {
            alert('Incorrect password');
            window.location.href = '/';
        }

        // Load fixtures
        async function loadFixtures() {
            try {
                const response = await fetch(
                    `https://v3.football.api-sports.io/fixtures?league=${LEAGUE_ID}&season=${SEASON}`,
                    { headers: { 'x-apisports-key': API_KEY } }
                );
                const data = await response.json();
                allFixtures = data.response || [];
                await loadPredictions();
            } catch (error) {
                console.error('Error fetching fixtures:', error);
            }
        }

        // Load all predictions
        async function loadPredictions() {
            try {
                const predictionsSnapshot = await getDocs(collection(db, 'predictions'));
                allPredictions = [];
                predictionsSnapshot.forEach(doc => {
                    allPredictions.push({ id: doc.id, ...doc.data() });
                });
                updateStats();
                renderMatches();
            } catch (error) {
                console.error('Error loading predictions:', error);
            }
        }

        // Update stats
        function updateStats() {
            const evaluated = allPredictions.filter(p => p.evaluated).length;
            const uniqueUsers = new Set(allPredictions.map(p => p.userId)).size;

            document.getElementById('totalPredictions').textContent = allPredictions.length;
            document.getElementById('evaluatedCount').textContent = evaluated;
            document.getElementById('pendingCount').textContent = allPredictions.length - evaluated;
            document.getElementById('activeUsers').textContent = uniqueUsers;
        }

        // Render matches
        function renderMatches() {
            const container = document.getElementById('matchesList');
            const finishedMatches = allFixtures.filter(f => f.fixture.status.short === 'FT');

            if (finishedMatches.length === 0) {
                container.innerHTML = '<div class="loading">No finished matches yet</div>';
                return;
            }

            container.innerHTML = finishedMatches.map(match => {
                const predictions = allPredictions.filter(p => p.fixtureId == match.fixture.id);
                return createMatchAdminCard(match, predictions);
            }).join('');

            attachEvaluateListeners();
        }

        // Create match admin card
        function createMatchAdminCard(match, predictions) {
            const homeTeam = match.teams.home.name;
            const awayTeam = match.teams.away.name;
            const homeScore = match.goals.home;
            const awayScore = match.goals.away;
            const evaluated = predictions.filter(p => p.evaluated).length;

            return `
                <div class="match-admin-card">
                    <div class="match-admin-header">
                        <div>
                            <h3>${homeTeam} vs ${awayTeam}</h3>
                            <p style="color: var(--color-text-muted); margin-top: 0.5rem;">
                                ${predictions.length} predictions · ${evaluated} evaluated · ${predictions.length - evaluated} pending
                            </p>
                        </div>
                        <div class="result-input">
                            <strong>Final Score:</strong>
                            <input type="number" value="${homeScore}" readonly style="background: var(--color-bg);">
                            <span>-</span>
                            <input type="number" value="${awayScore}" readonly style="background: var(--color-bg);">
                            <button class="btn-evaluate" data-fixture="${match.fixture.id}" data-home="${homeScore}" data-away="${awayScore}">
                                Evaluate All
                            </button>
                        </div>
                    </div>
                    <table class="predictions-table">
                        <thead>
                            <tr>
                                <th>User</th>
                                <th>Predicted Winner</th>
                                <th>Predicted Score</th>
                                <th>Points</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${predictions.map(pred => `
                                <tr>
                                    <td>${pred.userId}</td>
                                    <td>${pred.winner === 'home' ? homeTeam : pred.winner === 'away' ? awayTeam : 'Draw'}</td>
                                    <td class="prediction-score">${pred.homeScore} - ${pred.awayScore}</td>
                                    <td><span class="points-badge ${pred.points === 0 ? 'zero' : ''}">${pred.points || 0} pts</span></td>
                                    <td>${pred.evaluated ? '✓ Evaluated' : '⏳ Pending'}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        // Attach evaluate listeners
        function attachEvaluateListeners() {
            document.querySelectorAll('.btn-evaluate').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    const fixtureId = e.target.dataset.fixture;
                    const homeScore = parseInt(e.target.dataset.home);
                    const awayScore = parseInt(e.target.dataset.away);
                    await evaluateMatch(fixtureId, homeScore, awayScore);
                });
            });
        }

        // Evaluate match
        async function evaluateMatch(fixtureId, actualHomeScore, actualAwayScore) {
            if (!confirm('Evaluate all predictions for this match?')) return;

            const predictions = allPredictions.filter(p => p.fixtureId == fixtureId);
            const actualWinner = actualHomeScore > actualAwayScore ? 'home' : 
                                actualHomeScore < actualAwayScore ? 'away' : 'draw';

            let updated = 0;

            for (const pred of predictions) {
                let points = 0;

                // Check exact score (3 points)
                if (pred.homeScore === actualHomeScore && pred.awayScore === actualAwayScore) {
                    points = 3;
                }
                // Check winner only (1 point)
                else if (pred.winner === actualWinner) {
                    points = 1;
                }

                try {
                    await updateDoc(doc(db, 'predictions', pred.id), {
                        points: points,
                        evaluated: true
                    });
                    updated++;
                } catch (error) {
                    console.error('Error updating prediction:', error);
                }
            }

            alert(`Evaluated ${updated} predictions!`);
            await loadPredictions();
        }

        // Initial load
        loadFixtures();
    </script>
</body>
</html>
